services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - bambu_data:/data
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  bambu_data:
