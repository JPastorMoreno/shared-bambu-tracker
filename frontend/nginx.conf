server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API hacia el contenedor del backend en la red de compose.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta que no sea un fichero existente cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache larga para assets con hash en el nombre (los que genera Vite).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
